# WireGuard DKMS 配置文件
# 用于动态内核模块支持 (Dynamic Kernel Module Support)
PACKAGE_NAME="wireguard"          # 包名称
PACKAGE_VERSION="1.0.20220627"   # 包版本
AUTOINSTALL=yes                   # 自动安装

# 构建的模块名称
BUILT_MODULE_NAME="wireguard"
# 目标模块安装位置 - 网络子系统目录
DEST_MODULE_LOCATION="/kernel/net"

# 支持的内核版本要求：3.10 - 5.5（包含）
# 正则表达式匹配内核版本
BUILD_EXCLUSIVE_KERNEL="^((5\.[0-5]($|[.-]))|(4\.)|(3\.1[0-9]))"
